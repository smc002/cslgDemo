<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色动画 · 约束检查</title>
<style>*{box-sizing:border-box}body{margin:0;background:#123631;color:#f8edc5;font-family:system-ui,"Microsoft YaHei",sans-serif;padding:22px}header,main{max-width:1060px;margin:auto}h1{font-size:24px}p{color:#b3ccbe;line-height:1.6}a{color:#f7d76f}main{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}article{background:#285648;padding:14px;border:1px solid #688c6a;border-radius:16px}h2{font-size:19px;margin:0 0 10px}canvas{width:100%;display:block;background:radial-gradient(#e9d7a7,#ad9970);border-radius:12px}select,button,input{font:inherit}select,button{padding:8px;border:1px solid #bad49c;background:#163c35;color:#fff0bf;border-radius:7px}nav{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}label{font-size:13px;display:block;margin-top:10px}small{color:#b2cfbe}@media(max-width:720px){main{grid-template-columns:1fr;max-width:370px}}
</style><header><h1>角色动画 · 锁脚与射击朝向</h1><p>初始三英雄站定动作锁定下肢；行走、死亡保留全身序列。狙击手新增八个源朝向，镜像覆盖完整方向。可逐帧检查，青色线标记枪管方向。<a href="/#merged">返回物资搜刮 →</a></p></header><main id="heroes"></main>
<script type="module">
const names={shield:'持盾大汉',medic:'医疗兵',drone:'无人机手',sniper:'狙击手'},labels={idle:'待机',walk:'移动',attack:'普攻',skill:'技能',death:'死亡',crouch:'旧版蹲射',throw:'投手雷','aim-n':'向上射击','aim-nne':'右上偏上射击','aim-ene':'右上偏右射击','aim-ne':'右上射击','aim-e':'向右射击','aim-se':'右下射击','aim-sse':'右下偏下射击','aim-s':'向下射击'};
for(const hero of Object.keys(names)){
 const meta=await fetch(`/assets/animations/${hero}/clips.json`).then(r=>r.json());const art={};
 await Promise.all(meta.clips.map(async c=>{const im=new Image();im.src=`/assets/animations/${hero}/${c.name}.png`;await im.decode();art[c.name]=im}));
 const card=document.createElement('article');card.innerHTML=`<h2>${names[hero]}</h2><canvas width="360" height="380" aria-label="${names[hero]}动画"></canvas><nav><select aria-label="动作">${Object.entries(labels).filter(([k])=>meta.clips.some(c=>c.name===k)).map(([k,v])=>`<option value="${k}" ${k===(hero==='sniper'?'aim-n':'attack')?'selected':''}>${v}</option>`).join('')}</select><button class="play">暂停</button><button class="step">下一帧</button></nav><label>预览大小 <input aria-label="预览大小" type="range" min="80" max="280" value="220"></label><small class="frame"></small>`;document.querySelector('main').append(card);
 const canvas=card.querySelector('canvas'),ctx=canvas.getContext('2d'),sel=card.querySelector('select'),btn=card.querySelector('.play'),slider=card.querySelector('input');let elapsed=0,playing=true,index=0,last=performance.now();
 const setPlay=p=>{playing=p;btn.textContent=p?'暂停':'播放'};sel.onchange=()=>{elapsed=0;index=0;setPlay(true)};btn.onclick=()=>{if(sel.value==='death')elapsed=0;setPlay(!playing)};
 card.querySelector('.step').onclick=()=>{setPlay(false);const clip=meta.clips.find(c=>c.name===sel.value);index=(index+1)%clip.frames.length};
 function tick(now){const clip=meta.clips.find(c=>c.name===sel.value),duration=clip.frames.reduce((s,f)=>s+f.duration,0);if(playing){elapsed+=(now-last)/1000;let t=sel.value==='death'?Math.min(elapsed,duration):elapsed%duration;index=clip.frames.length-1;for(let n=0;n<clip.frames.length;n++){if(t<clip.frames[n].duration){index=n;break}t-=clip.frames[n].duration}}last=now;const f=clip.frames[index],s=Number(slider.value)/(3.2*clip.pixelsPerUnit);ctx.clearRect(0,0,360,380);ctx.strokeStyle='#31534670';ctx.beginPath();ctx.moveTo(20,341);ctx.lineTo(340,341);ctx.stroke();ctx.fillStyle='#233d3055';ctx.beginPath();ctx.ellipse(180,342,45,7,0,0,Math.PI*2);ctx.fill();ctx.drawImage(art[clip.name],f.x,f.y,f.w,f.h,180-f.anchorX*s,342-f.anchorY*s,f.w*s,f.h*s);if(clip.aimAngle!==undefined){const mx=180+(f.muzzleX-f.anchorX)*s,my=342+(f.muzzleY-f.anchorY)*s,a=clip.aimAngle*Math.PI/180;ctx.strokeStyle="#35efff";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(mx+Math.cos(a)*100,my+Math.sin(a)*100);ctx.stroke();ctx.fillStyle="#35efff";ctx.fillRect(mx-2,my-2,4,4)}card.querySelector('.frame').textContent=`${labels[clip.name]} · 第 ${index+1} / ${clip.frames.length} 帧`;requestAnimationFrame(tick)}requestAnimationFrame(tick);
}
</script></html>
