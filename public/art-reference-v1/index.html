<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>参考风格首批资源</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9edf1;color:#202b39;font:15px/1.7 'Microsoft YaHei',sans-serif}main{max-width:1300px;margin:auto;padding:30px}h1{margin:0;font-size:28px}p{max-width:860px;color:#556373}.layout{display:grid;grid-template-columns:390px 1fr;gap:24px;margin-top:24px}.phone{width:390px;max-width:100%;background:#172432;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px #17243222}.bar{padding:12px 18px;color:#fff;display:flex;justify-content:space-between}canvas{display:block;width:100%}.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border-radius:16px;padding:16px}.checker{background-color:#e5e8eb;background-image:linear-gradient(45deg,#fff8 25%,transparent 25%),linear-gradient(-45deg,#fff8 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#fff8 75%),linear-gradient(-45deg,transparent 75%,#fff8 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.card img{display:block;width:100%;height:260px;object-fit:contain}.card a{color:#245b94}label{display:block;margin:12px 0}button{cursor:pointer;border:0;padding:9px 16px;border-radius:8px;background:#245b94;color:white}.note{font-size:12px;color:#66717e}@media(max-width:850px){.layout{grid-template-columns:1fr}.phone{margin:auto}.cards{grid-template-columns:1fr 1fr}.card img{height:180px}}</style>
<main><h1>英雄与僵尸 参考风格首批样稿</h1><p>依据当前工程的 Canvas 2D 竖屏战斗制作：2 个英雄、2 种僵尸和 1 张纵向街道。左侧为 390×752 逻辑画布的静态合成预览，可测试背景滚动；右侧查看独立透明素材。</p><p class="note">静态风格样稿，尚未接入正式战斗。角色朝向、锚点与技能映射待校准；背景纵向接缝可用滚动开关检查。现有九个英雄的名称和武器与参考图不同，批量替换前需要明确对应关系。</p><label>角色显示比例 <input id="scale" type="range" min="0.7" max="1.5" step="0.05" value="1"> <span id="value">1.00</span> <button id="scroll">测试背景滚动</button></label><div class="layout"><div class="phone"><div class="bar"><b>物资搜刮 · 风格预览</b><span>静态样稿</span></div><canvas id="battle" width="390" height="752"></canvas><div class="bar">梨 · 仟手<span>普通僵尸 · 巨型僵尸</span></div></div><section class="cards" id="cards"></section></div><p><a href="street.png">下载战场背景</a> · <a href="manifest.json">查看资源规格与检查记录</a> · <a href="prompts.json">查看完整生成提示词</a></p></main>
<script>
const defs=[['hero-li','梨','双刀英雄，朝向待校准'],['hero-medic','仟手','医疗英雄，朝向待校准'],['zombie-normal','普通僵尸','小型敌人'],['zombie-giant','巨型僵尸','大型敌人']];
const cards=document.querySelector('#cards');for(const [id,name,note] of defs)cards.insertAdjacentHTML('beforeend',`<article class="card"><div class="checker"><img src="${id}.png" alt="${name}"></div><b>${name}</b><div class="note">${note}</div><a href="${id}.png" download>下载透明 PNG</a></article>`);
const c=document.querySelector('canvas'),ctx=c.getContext('2d'),images={};let factor=1,scrolling=false,offset=0,last=0;
async function load(id){const im=new Image;im.src=id+'.png';await im.decode();images[id]=im;}
const bounds={'hero-li':[238,86,1074,1144],'hero-medic':[305,61,1001,1196],'zombie-normal':[245,51,1019,1180],'zombie-giant':[93,62,1190,1197]};function draw(id,x,y,h){const m=images[id],b=bounds[id],s=h/(b[3]-b[1]),w=m.width*s;ctx.save();ctx.fillStyle='#25303935';ctx.beginPath();ctx.ellipse(x,y-4,h*.20,h*.055,0,0,7);ctx.fill();ctx.drawImage(m,x-(b[0]+b[2])*.5*s,y-b[3]*s,w,m.height*s);ctx.restore()}
function frame(t){const dt=last?Math.min((t-last)/1000,.1):0;last=t;if(scrolling)offset=(offset+dt*25)%752;ctx.drawImage(images.street,0,offset,390,752);ctx.drawImage(images.street,0,offset-752,390,752);ctx.fillStyle='#25303945';ctx.font='12px Microsoft YaHei';ctx.fillText('三路可读性与角色比例预览',110,35);draw('zombie-normal',102,225,40*factor);draw('zombie-normal',280,280,40*factor);draw('zombie-giant',195,345,57*factor);draw('hero-li',135,570,52*factor);draw('hero-medic',250,610,52*factor);requestAnimationFrame(frame)}
document.querySelector('#scale').oninput=e=>{factor=+e.target.value;document.querySelector('#value').textContent=factor.toFixed(2)};document.querySelector('#scroll').onclick=()=>{scrolling=!scrolling;document.querySelector('#scroll').textContent=scrolling?'停止滚动':'测试背景滚动'};Promise.all([...defs.map(d=>load(d[0])),load('street')]).then(()=>requestAnimationFrame(frame)).catch(e=>{ctx.fillText('素材加载失败：'+e.message,20,40)});
</script></html>
